name: CI

on:
  push:
    branches: [ feature/ads-bot-init ]
  pull_request:
    branches: [ feature/ads-bot-init ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: bale_db
          MYSQL_USER: bale_user
          MYSQL_PASSWORD: bale_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h"127.0.0.1" -uroot -prootpass && break || sleep 1
          done
      - name: Configure env
        run: |
          echo "DJANGO_SECRET_KEY=ci-secret" >> $GITHUB_ENV
          echo "DB_NAME=bale_db" >> $GITHUB_ENV
          echo "DB_USER=bale_user" >> $GITHUB_ENV
          echo "DB_PASSWORD=bale_pass" >> $GITHUB_ENV
          echo "DB_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "DB_PORT=3306" >> $GITHUB_ENV
          echo "BALE_BOT_TOKEN=${{ secrets.BALE_BOT_TOKEN }}" >> $GITHUB_ENV
          echo "BALE_CARD_NUMBER=${{ secrets.BALE_CARD_NUMBER }}" >> $GITHUB_ENV
      - name: Run migrations
        run: |
          python manage.py migrate --noinput
      - name: Run tests
        run: |
          python manage.py test --verbosity=2

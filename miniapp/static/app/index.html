<!DOCTYPE html>
<html lang="fa" dir="rtl" data-scheme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>لینک‌بانک</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <script src="https://tapi.bale.ai/miniapp.js?3"></script>
  <style>
    :root {
      --bg:#121417; --text:#f2f4f5; --hint:#8b98a5; --link:#3dcec0;
      --btn:#00a693; --btn-text:#fff; --sec:#1c2128; --header:#1a1f24;
      --bar:#1a1f24; --sep:#2a3138; --ok:#3dd68c; --danger:#ff6b6b; --accent:#3dcec0;
    }
    [data-scheme="light"] {
      --bg:#ffffff; --text:#1c1c1c; --hint:#8e8e93; --link:#008f7a;
      --btn:#00a693; --btn-text:#fff; --sec:#f4f4f5; --header:#ffffff;
      --bar:#ffffff; --sep:#e6e6e8; --ok:#0f9f6e; --danger:#e53935; --accent:#008f7a;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;min-height:100%}
    body{
      font-family:Vazirmatn,Tahoma,system-ui,sans-serif;
      background:var(--bg);color:var(--text);line-height:1.55;
      -webkit-font-smoothing:antialiased;
    }
    button{font:inherit;cursor:pointer}
    button:disabled{opacity:.45}
    #app{display:flex;flex-direction:column;min-height:100%;height:100%;width:100%}
    header{
      display:flex;align-items:center;gap:4px;
      background:var(--header);border-bottom:1px solid var(--sep);
      padding:env(safe-area-inset-top) 6px 0;position:sticky;top:0;z-index:5;
    }
    header .t{flex:1;text-align:center;padding:12px 0}
    header h1{margin:0;font-size:15px;font-weight:700}
    header .sub{font-size:11px;color:var(--hint)}
    .icon{width:44px;height:44px;border:0;background:none;color:var(--text);border-radius:12px}
    main{flex:1;padding:14px 14px 92px}
    .card{
      background:var(--sec);border:1px solid var(--sep);
      border-radius:16px;padding:14px;margin-bottom:10px;text-align:right;width:100%;color:inherit;
    }
    .card.tap{display:block}
    .row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
    .muted{color:var(--hint);font-size:12px}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
    .stat{background:var(--sec);border:1px solid var(--sep);border-radius:16px;padding:12px}
    .stat b{display:block;margin-top:4px;font-size:16px}
    .btn{
      min-height:44px;border:0;border-radius:12px;padding:0 14px;
      background:var(--btn);color:var(--btn-text);font-weight:600;width:100%;
    }
    .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--sep)}
    .btn.ok{background:rgba(61,214,140,.18);color:var(--ok)}
    .btn.danger{background:rgba(243,18,96,.15);color:var(--danger)}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--sep) 70%,transparent);color:var(--hint);margin-left:4px}
    .badge.ok{background:rgba(61,214,140,.15);color:var(--ok)}
    .badge.warn{background:rgba(42,171,238,.15);color:var(--accent)}
    .badge.danger{background:rgba(243,18,96,.15);color:var(--danger)}
    input,select,textarea{
      width:100%;min-height:44px;border-radius:12px;border:1px solid var(--sep);
      background:var(--bg);color:var(--text);padding:8px 12px;font:inherit;
    }
    textarea{min-height:88px;resize:vertical}
    label{display:grid;gap:6px;font-size:12px;color:var(--hint);margin-bottom:10px}
    nav.tabs{
      position:fixed;left:0;right:0;bottom:0;display:grid;
      background:var(--bar, var(--header));border-top:1px solid var(--sep);
      padding-bottom:env(safe-area-inset-bottom);
    }
    nav.tabs button{min-height:58px;border:0;background:none;color:var(--hint);font-size:11px}
    nav.tabs button.on{color:var(--link);font-weight:700}
    .empty{text-align:center;padding:40px 12px;color:var(--hint)}
    .toast{
      position:fixed;left:16px;right:16px;bottom:80px;z-index:20;
      background:var(--text);color:var(--bg);padding:12px;border-radius:16px;
      text-align:center;display:none;
    }
    .toast.show{display:block}
    .day{
      min-height:68px;border-radius:16px;border:1px solid var(--sep);
      background:var(--sec);color:var(--text);text-align:right;padding:8px 10px;
    }
    .day.free{border-color:color-mix(in srgb,var(--ok) 45%,var(--sep))}
    .day.busy{background:rgba(243,18,96,.08);border-color:color-mix(in srgb,var(--danger) 40%,var(--sep))}
    a{color:var(--link)}
    h3{margin:0 0 6px;font-size:14px}
    .rolebar{display:flex;gap:6px;padding:0 12px 10px;flex-wrap:wrap;justify-content:center}
    .rolebar button{min-height:36px;border:0;border-radius:999px;padding:0 12px;font-size:12px;font-weight:600;background:transparent;color:var(--hint)}
    .rolebar button.on{background:var(--link);color:#fff}
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="toast" id="toast"></div>
  <script>
  (function(){
    const API='/miniapp/api';
    const FA='۰۱۲۳۴۵۶۷۸۹';
    let initData='', me=null, role='manager', stack=[{name:'home'}], cache={}, scheme='dark';
    function wa(){return (window.Bale&&window.Bale.WebApp)||(window.Telegram&&window.Telegram.WebApp)||null;}
    function faNum(v){return String(v??'').replace(/[0-9]/g,d=>FA[+d]);}
    function money(n){const s=Math.round(n||0).toLocaleString('en-US').replace(/,/g,'٬');return faNum(s)+' تومان';}
    function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2400);}
    function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));}
    function applyTheme(){
      const w=wa();
      if(w && (w.colorScheme==='light' || w.colorScheme==='dark')) scheme=w.colorScheme;
      document.documentElement.setAttribute('data-scheme', scheme);
      const tp=w&&w.themeParams; if(!tp) return;
      const map={bg_color:'--bg',text_color:'--text',hint_color:'--hint',link_color:'--link',button_color:'--btn',button_text_color:'--btn-text',secondary_bg_color:'--sec',header_bg_color:'--header',bottom_bar_bg_color:'--bar',section_separator_color:'--sep',destructive_text_color:'--danger'};
      const r=document.documentElement.style; Object.keys(map).forEach(k=>{ if(tp[k]) r.setProperty(map[k], tp[k]); });
    }
    async function api(path,opts){
      opts=opts||{}; const headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});
      if(initData) headers['X-Bale-Init-Data']=initData;
      let url=API+path; const method=(opts.method||'GET').toUpperCase(); let body=opts.body;
      const q=new URLSearchParams(location.search); const debug=q.get('debug_bale_id');
      if(debug){ if(method==='GET') url+=(url.includes('?')?'&':'?')+'debug_bale_id='+encodeURIComponent(debug);
        else{const o=typeof body==='string'?JSON.parse(body||'{}'):(body||{});o.debug_bale_id=debug;o.initData=initData||'';body=JSON.stringify(o);} }
      else if(method==='POST'&&initData){const o=typeof body==='string'?JSON.parse(body||'{}'):(body||{});o.initData=initData;body=JSON.stringify(o);}
      const res=await fetch(url,{method,headers,body:method==='GET'?undefined:body});
      const data=await res.json().catch(()=>({ok:false,error:'bad_json'}));
      if(!res.ok||data.ok===false) throw new Error(data.message||data.error||('http_'+res.status));
      return data;
    }
    function screen(){return stack[stack.length-1];}
    function push(s){stack.push(s);render();} function back(){if(stack.length>1) stack.pop();render();} function go(s){stack=[s];render();}
    function title(){ const n=screen().name; if(n==='home') return role==='operator'?'پنل پشتیبانی':role==='customer'?'پنل مشتری':'پنل مدیر کانال'; return n; }
    function tabs(){
      if(role==='operator') return [{id:'home',l:'خانه',s:{name:'home'}},{id:'opb',l:'بنرها',s:{name:'opb'}},{id:'opp',l:'تسویه',s:{name:'opp'}},{id:'orders',l:'سفارش‌ها',s:{name:'orders'}}];
      if(role==='customer') return [{id:'home',l:'خانه',s:{name:'home'}},{id:'banners',l:'بنرها',s:{name:'banners'}},{id:'catalog',l:'فهرست',s:{name:'catalog'}},{id:'cart',l:'سبد',s:{name:'cart'}},{id:'finance',l:'مالی',s:{name:'wallet'}}];
      return [{id:'home',l:'خانه',s:{name:'home'}},{id:'channels',l:'کانال‌ها',s:{name:'channels'}},{id:'orders',l:'سفارش‌ها',s:{name:'orders'}},{id:'calendar',l:'تقویم',s:{name:'calendar'}},{id:'finance',l:'مالی',s:{name:'finance'}}];
    }
    function tabOn(){ const n=screen().name; if(n==='channel'||n==='tariffs') return 'channels'; if(n==='wallet'||n==='finance') return 'finance'; return n; }
    function roleBar(){
      const caps=(me&&me.caps)||{customer:true,manager:false,operator:false};
      const items=[]; if(caps.manager||role==='manager') items.push(['manager','مدیر']); items.push(['customer','مشتری']); if(caps.operator) items.push(['operator','پشتیبانی']);
      if(items.length<2) return '';
      return `<div class="rolebar">${items.map(([id,l])=>`<button type="button" data-role="${id}" class="${role===id?'on':''}">${l}</button>`).join('')}</div>`;
    }
    async function view(){
      try{
        if(role==='customer'){
          if(screen().name==='home') return `<div class="stats"><div class="stat"><span class="muted">موجودی</span><b>${money((me.wallet&&me.wallet.available)||0)}</b></div><div class="stat"><span class="muted">سبد</span><b>${faNum(0)}</b></div></div><div class="card"><div class="muted">شناسه</div><div>${esc(me.user.handle||me.user.bale_user_id)}</div></div>`;
          return '<div class="empty">این بخش به‌زودی</div>';
        }
        if(role==='operator') return '<div class="empty">پنل پشتیبانی</div>';
        if(screen().name==='home'){
          const noCh=!(me.channel_count>0);
          return `<div class="stats"><div class="stat"><span class="muted">موجودی قابل برداشت</span><b>${money((me.wallet&&me.wallet.available)||0)}</b></div><div class="stat"><span class="muted">سفارش در انتظار</span><b>${faNum(me.pending_orders||0)}</b></div></div>`+
            (noCh?`<div class="card"><h3>هنوز کانالی ثبت نشده</h3><p class="muted">در بازو لینک کانال را بفرستید. بعد از ثبت، پنل کامل مدیر فعال می‌شود.</p></div>`:`<div class="card"><div class="muted">شناسه</div><div>${esc(me.user.handle||me.user.bale_user_id)}</div><p class="muted">${faNum(me.channel_count)} کانال</p></div>`)+`
            <div class="grid2"><button class="btn ghost" data-go='{"name":"channels"}'>کانال‌ها</button><button class="btn ghost" data-go='{"name":"orders"}'>سفارش‌ها</button></div>`;
        }
        if(screen().name==='channels'){
          const data=await api('/channels');
          if(!data.channels.length) return '<div class="empty">کانالی نیست. از بازو لینک بفرستید.</div>';
          return data.channels.map(ch=>`<div class="card"><b>${esc(ch.name)}</b><div class="muted">${esc(ch.link||'')}</div></div>`).join('');
        }
        if(screen().name==='orders'){
          const data=await api('/orders');
          if(!data.orders.length) return '<div class="empty">سفارشی نیست</div>';
          return data.orders.map(o=>`<div class="card"><b>سفارش ${faNum(o.order_id)}</b><p class="muted">${esc(o.owner)} · ${money(o.price)}</p></div>`).join('');
        }
        if(screen().name==='finance'){
          const data=await api('/wallet');
          return `<div class="card"><b>${money((data.balance&&data.balance.available)||0)}</b><p class="muted">قابل برداشت</p></div>`;
        }
        return '<div class="empty">…</div>';
      }catch(e){return `<div class="empty">${esc(e.message)}</div>`;}
    }
    async function render(){
      const app=document.getElementById('app'); const t=tabs();
      app.innerHTML=`<header>${stack.length>1?'<button class="icon" id="back">→</button>':'<span class="icon"></span>'}<div class="t"><h1>${esc(title())}</h1><div class="sub">${esc((me&&me.user&&(me.user.handle||me.user.bale_user_id))||'…')}</div></div><span class="icon"></span></header>${roleBar()}<main id="view"><div class="empty">…</div></main><nav class="tabs" style="grid-template-columns:repeat(${t.length},1fr)">${t.map(x=>`<button data-go='${JSON.stringify(x.s)}' class="${tabOn()===x.id?'on':''}">${x.l}</button>`).join('')}</nav>`;
      document.getElementById('view').innerHTML=await view();
      const backBtn=document.getElementById('back'); if(backBtn) backBtn.onclick=back;
      document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{ const r=b.getAttribute('data-role'); if(r==='manager'||r==='customer'||r==='operator'){ role=r; localStorage.setItem('lb_role', r); stack=[{name:'home'}]; render(); } });
      document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(JSON.parse(b.getAttribute('data-go'))));
    }
    async function boot(){
      applyTheme(); const w=wa();
      if(w){ try{w.ready(); w.expand();}catch(e){} initData=w.initData||''; if(w.onEvent){ try{w.onEvent('themeChanged',applyTheme);}catch(e){} } }
      try{
        me=await api('/me');
        const caps={operator:!!me.is_operator,manager:!!(me.channel_count>0||me.can_be_manager),customer:true}; me.caps=caps;
        const q=new URLSearchParams(location.search).get('role'); const saved=(localStorage.getItem('lb_role')||'');
        let pick=q||saved||''; if(pick==='operator'&&!caps.operator) pick='';
        if(q==='manager') role='manager'; else if(pick==='operator'||pick==='manager'||pick==='customer') role=pick;
        else role=caps.operator?'operator':(caps.manager?'manager':'customer');
        localStorage.setItem('lb_role', role);
      }catch(e){
        document.getElementById('app').innerHTML=`<main class="empty">خطای احراز هویت<br>${esc(e.message)}</main>`; return;
      }
      render();
    }
    boot();
  })();
  </script>
</body>
</html>

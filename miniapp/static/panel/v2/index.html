    window.__LB_BALE = null;

    window.__LB_WAIT_BALE = new Promise(function (resolve) {
      var n = 0;
      function tick() {
        var w = window.Bale && Bale.WebApp;
        if (w) {
          try { if (typeof w.ready === "function") w.ready(); } catch (e) {}
          /* no expand — keep Bale mini-app chrome */
          window.__LB_BALE = w;
          try { if (typeof w.setHeaderColor === 'function') w.setHeaderColor('#0E4A5C'); } catch (e) {}
          if (w.initDataUnsafe && w.initDataUnsafe.user) window.__LB_USER = w.initDataUnsafe.user;
          if (w.initData || window.__LB_USER) { resolve(w); return; }
        }
        if (++n > 60) { resolve(w || null); return; }
        setTimeout(tick, 100);
      }
      tick();
    });
  </script>
  <script>
    (function () {
      var r = document.documentElement, s = null, saved = null;
      try {
        s = localStorage.getItem("lb.theme");
        if (s !== "light" && s !== "dark") {
          saved = JSON.parse(localStorage.getItem("lb.scenario.ui.v1") || "{}");
          s = saved && (saved.theme === "light" || saved.theme === "dark") ? saved.theme : null;
        }
      } catch (e) {}
      var w = window.Bale && Bale.WebApp, b = (w && w.colorScheme) || "light";
      if (!w && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) b = "dark";
      var bg = w && w.themeParams && w.themeParams.bg_color;
      if (!s && bg && /^#([0-9a-f]{6})$/i.test(bg)) {
        var n = parseInt(bg.slice(1), 16);
        var l = (0.2126 * (n >> 16) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255)) / 255;
        b = l < 0.4 ? "dark" : "light";
      }
      var t = s === "light" || s === "dark" ? s : b;
      r.dataset.theme = t;
      r.style.colorScheme = t;
    })();
  </script>
